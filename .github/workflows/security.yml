name: Security Scan

on:
  pull_request:
    branches:
      - main
# Uncomment to enable Git Flow workflow
#      - develop
#      - release/**
  schedule:
    - cron: '0 0 * * 1' # Every Monday at midnight
  workflow_dispatch: {}

permissions:
  contents: read
#  security-events: write # Uncomment for upload Snyk SARIF to GitHub Security Dashboard

env:
  PYTHON_VERSION: "3.12"

jobs:
  snyk-security-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Install Snyk Python dependencies
        run: |
          pip install -e . --group dev
          pip freeze > requirements.txt

      - name: Run Snyk for Open Source Vulnerabilities (OSS)
        run: |
          set +e
          snyk test \
            --file=requirements.txt \
            --package-manager=pip \
            --org="$SNYK_ORG_ID" \
            --sarif-file-output=snyk-oss.sarif
          status=$?
          set -e

          case "$status" in
            0)
              echo "Snyk OSS: No vulnerabilities found."
              ;;
            1)
              echo "::warning title=Snyk OSS::Vulnerabilities detected. See the uploaded SARIF report."
              ;;
            *)
              echo "::error title=Snyk OSS::Scan failed with exit code $status. Check authentication and scanner configuration."
              ;;
          esac
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_ORG_ID: ${{ secrets.SNYK_ORG_ID }}

      - name: Run Snyk Code (SAST)
        run: |
          set +e
          snyk code test \
            --sarif-file-output=snyk-code.sarif
          status=$?
          set -e

          case "$status" in
            0)
              echo "Snyk Code: No vulnerabilities found."
              ;;
            1)
              echo "::warning title=Snyk Code::Vulnerabilities detected. See the uploaded SARIF report."
              ;;
            *)
              echo "::error title=Snyk Code::Scan failed with exit code $status. Check authentication and scanner configuration."
              ;;
          esac
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload SARIF as build artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snyk-results
          path: |
            snyk-code.sarif
            snyk-oss.sarif
          if-no-files-found: warn

      # --- Upload Snyk SARIF to GitHub Security Dashboard ---
      # Requires GitHub Code Security availability for the repository.
      #- name: Upload SARIF to GitHub Security
      #  uses: github/codeql-action/upload-sarif@v4
      #  with:
      #    sarif_file: snyk-code.sarif

  bandit-sast:
    name: Bandit Static Application Security Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv and cache dependencies
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install project dependencies
        run: |
          uv lock
          uv sync

      - name: Run Bandit security linter
        run: uv run bandit -r src/ -c pyproject.toml -f json -o bandit-report.json

      - name: Upload Bandit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: warn

  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog PR Scan
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}

      - name: TruffleHog Full History Scan
        if: github.event_name != 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ""
          head: ${{ github.ref_name }}
