name: Bootstrap Template

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install yq
        uses: mikefarah/yq@v4.54.3

      - name: Collect repository description
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          DESCRIPTION="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.description // ""' | tr '\r\n' ' ')"

          if [[ -z "$DESCRIPTION" ]]; then
            DESCRIPTION="A Python project generated from Python Project Blueprint."
          fi

          printf 'description=%s\n' "$DESCRIPTION" >> "$GITHUB_OUTPUT"

      - name: Load bootstrap configuration
        id: load_config
        run: |
          set -euo pipefail

          EMAIL="$(yq -r '.email' .github/bootstrap-config.yml)"
          printf 'email=%s\n' "$EMAIL" >> "$GITHUB_OUTPUT"

      - name: Prepare project
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          BOOTSTRAP_DESCRIPTION: ${{ steps.meta.outputs.description }}
          BOOTSTRAP_EMAIL: ${{ steps.load_config.outputs.email }}
        run: |
          set -euo pipefail
          python .github/scripts/bootstrap.py prepare

      - name: Finalize project
        run: |
          set -euo pipefail
          python .github/scripts/bootstrap.py finalize

      - name: Commit and push generated project
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A
          git commit -m "chore: bootstrap project from template"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Bootstrap summary
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "## ✅ Bootstrap Complete!" >> "$GITHUB_STEP_SUMMARY"
          echo "Project **${REPOSITORY##*/}** was bootstrapped successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "Bootstrap-only files have been removed and the changes pushed."  >> "$GITHUB_STEP_SUMMARY"
